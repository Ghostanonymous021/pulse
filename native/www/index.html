<!doctype html>
<html lang="pt">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <title>Pulse</title>
    <style>
      html,
      body {
        margin: 0;
        min-height: 100%;
        background: #09090b;
        color: #f5f5f7;
        font-family: system-ui, sans-serif;
      }
      main {
        box-sizing: border-box;
        min-height: 100dvh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 2rem 1.5rem;
        padding-bottom: max(2rem, env(safe-area-inset-bottom));
      }
      h1 {
        font-size: 1.25rem;
        font-weight: 600;
        margin: 0 0 0.5rem;
      }
      p {
        margin: 0;
        color: #98989d;
        line-height: 1.45;
      }
    </style>
  </head>
  <body>
    <main>
      <h1>Pulse</h1>
      <p>
        Sem ligação ao servidor. Verifica a internet e volta a abrir a app.
      </p>
    </main>
  </body>
</html>
